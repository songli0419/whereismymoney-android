name: Build 我钱呢 Android APK v1.0.3 FIXED

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore offline Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'android-app'
          printf '%s' '' | base64 --decode > 'android-app/README.md'
          mkdir -p 'android-app/app'
          printf '%s' '' | base64 --decode > 'android-app/app/build.gradle'
          mkdir -p 'android-app/app'
          printf '%s' 'IyBObyBKYXZhU2NyaXB0IGJyaWRnZSBvciByZWZsZWN0aW9uLWJhc2VkIEFQSSBpcyBleHBvc2VkIHRvIHRoZSBlbWJlZGRlZCBwYWdlLgo=' | base64 --decode > 'android-app/app/proguard-rules.pro'
          mkdir -p 'android-app/app/src/main'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/AndroidManifest.xml'
          mkdir -p 'android-app/app/src/main/assets/web'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/assets/web/index.html'
          mkdir -p 'android-app/app/src/main/java/com/whereismymoney/app'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/java/com/whereismymoney/app/MainActivity.java'
          mkdir -p 'android-app/app/src/main/res/drawable'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/res/drawable/app_icon.png'
          mkdir -p 'android-app/app/src/main/res/values'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/res/values/styles.xml'
          mkdir -p 'android-app'
          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 --decode > 'android-app/build.gradle'
          mkdir -p 'android-app'
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 --decode > 'android-app/gradle.properties'
          mkdir -p 'android-app'
          printf '%s' '' | base64 --decode > 'android-app/settings.gradle'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Keep one signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: whereismymoney-signing-key-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon
      - name: Prepare named APK
        run: cp 'android-app/app/build/outputs/apk/debug/app-debug.apk' '我钱呢-v1.0.3.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 我钱呢-安卓安装包-v1.0.3
          path: 我钱呢-v1.0.3.apk
          if-no-files-found: error
      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title '我钱呢 最新版' --notes '个人测试版安装包'
          gh release upload latest '我钱呢-v1.0.3.apk' --clobber
