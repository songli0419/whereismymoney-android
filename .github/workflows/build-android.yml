name: Build permanent signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: permanent-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WM_SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      WM_KEYSTORE_PATH: ${{ github.workspace }}/signing/release.jks
    steps:
      - uses: actions/checkout@v4
      - name: Restore offline app and encrypted signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'android-app'
          printf '%s' '' | base64 --decode > 'android-app/README.md'
          mkdir -p 'android-app/app'
          printf '%s' '' | base64 --decode > 'android-app/app/build.gradle'
          mkdir -p 'android-app/app'
          printf '%s' 'IyBObyBKYXZhU2NyaXB0IGJyaWRnZSBvciByZWZsZWN0aW9uLWJhc2VkIEFQSSBpcyBleHBvc2VkIHRvIHRoZSBlbWJlZGRlZCBwYWdlLgo=' | base64 --decode > 'android-app/app/proguard-rules.pro'
          mkdir -p 'android-app/app/src/main'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/AndroidManifest.xml'
          mkdir -p 'android-app/app/src/main/assets/web'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/assets/web/index.html'
          mkdir -p 'android-app/app/src/main/java/com/whereismymoney/app'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/java/com/whereismymoney/app/MainActivity.java'
          mkdir -p 'android-app/app/src/main/res/drawable'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/res/drawable/app_icon.png'
          mkdir -p 'android-app/app/src/main/res/values'
          printf '%s' '' | base64 --decode > 'android-app/app/src/main/res/values/styles.xml'
          mkdir -p 'android-app'
          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 --decode > 'android-app/build.gradle'
          mkdir -p 'android-app'
          printf '%s' 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 --decode > 'android-app/gradle.properties'
          mkdir -p 'android-app'
          printf '%s' '' | base64 --decode > 'android-app/settings.gradle'
          mkdir -p 'signing'
          printf '%s' 'RDhFRDI2NTZCMDlCMUVDRjVFRjE2OTVGOUIyRDA3M0U5OEU1NzlEOEFGRDZEMTRGM0IzRDUzRDQwREM5RkMwMgo=' | base64 --decode > 'signing/certificate-sha256.txt'
          mkdir -p 'signing'
          printf '%s' '' | base64 --decode > 'signing/whereismymoney-release.jks.enc'
          mkdir -p 'tests'
          printf '%s' '' | base64 --decode > 'tests/date-transitions.cjs'
      - name: Assign increasing APK version code
        run: echo "WM_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test date transitions
        run: TZ=Asia/Shanghai node tests/date-transitions.cjs
      - name: Restore permanent signing key and verify certificate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WM_SIGNING_PASSWORD" ]; then
            echo '::error::Add repository Actions secret SIGNING_PASSWORD. A new key will never be generated automatically.'
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/whereismymoney-release.jks.enc -out "$WM_KEYSTORE_PATH" \
            -pass env:WM_SIGNING_PASSWORD
          actual=$(keytool -exportcert -keystore "$WM_KEYSTORE_PATH" -storepass:env WM_SIGNING_PASSWORD -alias whereismymoney | sha256sum | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          expected=$(tr -d '\r\n' < signing/certificate-sha256.txt)
          test "$actual" = "$expected"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon
      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk | tee apk-signature.txt
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' apk-signature.txt | head -1 | tr -d ': \r\n' | tr '[:lower:]' '[:upper:]')
          expected=$(tr -d '\r\n' < signing/certificate-sha256.txt)
          test "$actual" = "$expected"
          cp android-app/app/build/outputs/apk/release/app-release.apk whereismymoney.apk
      - uses: actions/upload-artifact@v4
        with:
          name: whereismymoney-permanent-signed-apk
          path: |
            whereismymoney.apk
            apk-signature.txt
          if-no-files-found: error
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title '我钱呢？！最新版' --notes '永久签名版本'
          gh release upload latest whereismymoney.apk --clobber
      - name: Remove decrypted key
        if: always()
        run: rm -f "$WM_KEYSTORE_PATH"
